name: E2E Real Builder Button
# E2E revision 3: repository_dispatch build trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for Render deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            HEALTH=$(curl -fsS --max-time 20 https://ai-app-builder-qa64.onrender.com/api/health || true)
            if printf '%s' "$HEALTH" | grep -q '"e2eSmoke":true'; then
              echo 'New E2E-enabled Render version is live'
              exit 0
            fi
            sleep 10
          done
          echo 'New E2E-enabled Render version did not become live in time'
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e
          cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Click the real Build APK button and wait for a real APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/e2e/button-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://ai-app-builder-qa64.onrender.com';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();

          await page.goto(base + '/?e2e=1', {waitUntil:'domcontentloaded', timeout:60000});
          await page.evaluate((token) => {
            localStorage.setItem('aib_gh', token);
            localStorage.setItem('aib_owner', 'ZYGY7678');
            localStorage.setItem('aib_repo', 'BINH');
            localStorage.removeItem('aib_gem');
          }, process.env.GITHUB_TOKEN);
          await page.reload({waitUntil:'domcontentloaded', timeout:60000});

          await page.locator('#prompt').fill('E2E smoke test: build a simple Android app with one screen and a button.');
          const responsePromise = page.waitForResponse(
            r => r.url().endsWith('/api/build') && r.request().method() === 'POST',
            {timeout:30000}
          );
          await page.locator('#buildBtn').click();
          const response = await responsePromise;
          const body = await response.json();
          if (response.status() !== 202 || !body.jobId) {
            throw new Error('Real Build APK button did not start a job: HTTP ' + response.status() + ' ' + JSON.stringify(body));
          }
          if (!(await page.locator('#buildBtn').isDisabled())) {
            throw new Error('Build button did not enter the in-progress state');
          }

          const jobId = body.jobId;
          fs.writeFileSync('/tmp/e2e-job-id', jobId, 'utf8');

          const branchDeadline = Date.now() + 3 * 60 * 1000;
          let state;
          while (Date.now() < branchDeadline) {
            state = await page.evaluate(async (id) => {
              const r = await fetch('/api/build/' + id, {cache:'no-store'});
              return await r.json();
            }, jobId);
            if (state.branch) break;
            if (state.status === 'failed') throw new Error('Site failed before GitHub branch: ' + (state.error || state.stage || 'unknown error'));
            await page.waitForTimeout(2000);
          }
          if (!state?.branch) throw new Error('Site never exposed the created builder branch');

          const deadline = Date.now() + 15 * 60 * 1000;
          while (Date.now() < deadline) {
            state = await page.evaluate(async (id) => {
              const r = await fetch('/api/build/' + id, {cache:'no-store'});
              return await r.json();
            }, jobId);
            if (state.runId) break;
            if (state.status === 'failed' && !state.runId) {
              throw new Error('Site build failed before workflow started: ' + (state.error || state.stage || 'unknown error'));
            }
            await page.waitForTimeout(3000);
          }
          if (!state?.runId) throw new Error('Site did not detect the dispatched Build APK run');

          while (Date.now() < deadline) {
            state = await page.evaluate(async (id) => {
              const r = await fetch('/api/build/' + id, {cache:'no-store'});
              return await r.json();
            }, jobId);
            if (state.status === 'ready') break;
            if (state.status === 'failed') throw new Error('Site build failed: ' + (state.error || state.stage || 'unknown error'));
            await page.waitForTimeout(5000);
          }
          if (!state || state.status !== 'ready') {
            throw new Error('Timed out waiting for the site build to reach ready');
          }

          const downloadPromise = page.waitForEvent('download', {timeout:30000});
          await page.locator('#download').click();
          const download = await downloadPromise;
          await download.saveAs('/tmp/ai-app-builder-e2e.apk');
          const size = fs.statSync('/tmp/ai-app-builder-e2e.apk').size;
          if (size < 100000) throw new Error('Downloaded APK is unexpectedly small: ' + size + ' bytes');

          console.log(JSON.stringify({ok:true,jobId,runUrl:state.runUrl,apkBytes:size}));
          await browser.close();
          EOF
          cd /tmp/e2e
          node button-test.mjs

      - name: Cleanup E2E builder branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          if [ -s /tmp/e2e-job-id ]; then
            JOB_ID=$(cat /tmp/e2e-job-id)
            curl -fsS -X DELETE \\
              -H "Accept: application/vnd.github+json" \\
              -H "Authorization: Bearer $GITHUB_TOKEN" \\
              -H "X-GitHub-Api-Version: 2022-11-28" \\
              "https://api.github.com/repos/ZYGY7678/BINH/git/refs/heads/builder/$JOB_ID" || true
          fi
