name: UI E2E Verification
on:
  push:
    branches:
      - 'e2e/**'
permissions:
  contents: write
  actions: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELFTEST_TOKEN: e2e-test-token
        run: |
          node <<'NODE'
          (async()=>{ const { chromium } = require('playwright');
          const base = 'https://ai-app-builder-qa64.onrender.com';
          const prompt = 'צור אפליקציית בדיקה פשוטה עם מסך אחד וכפתור שלום';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true});
          await context.addInitScript(({gh}) => {
            localStorage.setItem('aib_gh', '__SELFTEST_GH__');
            localStorage.setItem('aib_gem', '__SELFTEST__');
            localStorage.setItem('aib_owner', 'ZYGY7678');
            localStorage.setItem('aib_repo', 'BINH');
          }, {gh:process.env.GITHUB_TOKEN});
          const page = await context.newPage();
          await page.route('**/api/build**', async route => {
            const headers = {...route.request().headers(), 'x-selftest-token':process.env.SELFTEST_TOKEN, 'x-selftest-github-token':process.env.GITHUB_TOKEN};
            await route.continue({headers});
          });
          await page.goto(base+'/', {waitUntil:'networkidle', timeout:60000});
          await page.locator('#settingsBtn').click();
          await page.locator('#closeSettings').click();
          await page.locator('#prompt').fill(prompt);
          const buildResponsePromise=page.waitForResponse(r=>r.url().endsWith('/api/build')&&r.request().method()==='POST',{timeout:30000});
          await page.locator('#buildBtn').click();
          const buildResponse=await buildResponsePromise;
          const buildText=await buildResponse.text();
          if(!buildResponse.ok()) throw new Error('Build API HTTP '+buildResponse.status()+': '+buildText.slice(0,1000));
          let buildData; try{buildData=JSON.parse(buildText)}catch(e){throw new Error('Build API returned invalid JSON: '+buildText.slice(0,1000))}
          if(!buildData.jobId) throw new Error('Build API did not return jobId');
          await page.locator('#jobPanel').waitFor({state:'visible', timeout:30000});
          const saw = new Set();
          const deadline = Date.now()+20*60*1000;
          let last='';
          while(Date.now()<deadline){
            await page.waitForTimeout(5000);
            const status=await page.locator('#jobStatus').textContent();
            const subtitle=await page.locator('#jobSubtitle').textContent();
            const count=await page.locator('#eventCount').textContent();
            const texts=await page.locator('#timeline').locator('.event').allTextContents();
            const blob=[...texts,status,subtitle,count].join(' | ');
            last=blob;
            for(const t of texts){
              if(t.includes('נשלחת בקשה ל־Gemini')) saw.add('gemini-request');
              if(t.includes('Gemini החזיר תשובה')) saw.add('gemini-response');
              if(t.includes('נוצר ענף GitHub')) saw.add('branch');
              if(t.includes('מעלה קבצים ל־GitHub')) saw.add('upload');
              if(t.includes('מפעיל GitHub Actions')) saw.add('actions');
              if(t.includes('GitHub Actions בבנייה')) saw.add('build');
              if(t.includes('ה־APK מוכן')) saw.add('apk');
            }
            if(status==='מוכן'){
              const countNum=parseInt((count||'0').replace(/[^0-9]/g,''),10)||0;
              if(!saw.has('gemini-request')||!saw.has('gemini-response')||!saw.has('branch')||!saw.has('upload')||!saw.has('actions')||!saw.has('apk')) throw new Error('Timeline missing stages: '+JSON.stringify([...saw]));
              if(countNum<7) throw new Error('Too few timeline events: '+countNum);
              const dlResponse=page.waitForResponse(r=>r.url().includes('/api/build/')&&r.url().endsWith('/download')&&r.request().method()==='GET',{timeout:60000});
              await page.locator('#download').click();
              const rr=await dlResponse;
              if(!rr.ok()){
                const errBody=await rr.text().catch(()=> '');
                console.log('PROD_DOWNLOAD_FAILURE '+JSON.stringify({http:rr.status(),body:errBody.slice(0,1500)}));
                try{
                  const {execFileSync}=require('node:child_process');
                  const fs=require('node:fs');
                  const endpoint='repos/ZYGY7678/BINH/actions/runs?branch='+encodeURIComponent('builder/'+buildData.jobId)+'&per_page=20';
                  const runsJson=JSON.parse(execFileSync('gh',['api',endpoint],{encoding:'utf8'}));
                  const good=(runsJson.workflow_runs||[]).find(x=>x.name==='Build APK'&&x.conclusion==='success')||null;
                  console.log('DIRECT_GITHUB_RUN '+JSON.stringify({runId:good?.id||null}));
                  if(good){
                    const artsJson=JSON.parse(execFileSync('gh',['api','repos/ZYGY7678/BINH/actions/runs/'+good.id+'/artifacts'],{encoding:'utf8'}));
                    const art=(artsJson.artifacts||[]).find(x=>x.name==='apk-'+buildData.jobId&&!x.expired)||null;
                    console.log('DIRECT_GITHUB_ARTIFACT '+JSON.stringify({artifactId:art?.id||null}));
                    if(art){
                      const out='/tmp/e2e-artifact.zip';
                      try{
                        execFileSync('gh',['api','repos/ZYGY7678/BINH/actions/artifacts/'+art.id+'/zip','--output',out]);
                        console.log('DIRECT_GITHUB_ZIP '+JSON.stringify({bytes:fs.statSync(out).size}));
                      }catch(e){
                        console.log('DIRECT_GITHUB_ZIP_FAILURE '+JSON.stringify({code:e.status||null,stdout:String(e.stdout||'').slice(0,2000),stderr:String(e.stderr||'').slice(0,2000)}));
                      }
                    }
                  }
                }catch(diag){ console.log('DIRECT_GITHUB_DIAG_ERROR '+diag.message); }
                throw new Error('APK download HTTP '+rr.status()+': '+errBody.slice(0,1500));
              }
              const body=await rr.body();
              const size=body.length;
              const ct=rr.headers()['content-type']||'';
              if(!ct.includes('application/vnd.android.package-archive')) throw new Error('Unexpected APK content-type: '+ct);
              if(size<1024*1024) throw new Error('APK too small: '+size);
              console.log('UI_E2E_OK '+JSON.stringify({status,count,last,timelineStages:[...saw],apkBytes:size,contentType:ct,url:base}));
              await browser.close();
              process.exit(0);
            }
            if(status==='נכשל') throw new Error('Build failed in UI: '+last);
          }
          throw new Error('Timed out: '+last);
          })().catch(e=>{ console.error(e.stack||e); process.exit(1); });
          NODE
