name: Build APK
on:
  push:
    branches:
      - 'builder/**'
    paths:
      - '.build-trigger'
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-app-builder-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Resolve project
        shell: bash
        run: |
          if [ -n "${{ inputs.project_id }}" ]; then
            echo "PROJECT_ID=${{ inputs.project_id }}" >> "$GITHUB_ENV"
          else
            echo "PROJECT_ID=${GITHUB_REF_NAME#builder/}" >> "$GITHUB_ENV"
          fi
      - name: Verify project files
        shell: bash
        run: |
          test -f "builds/$PROJECT_ID/settings.gradle.kts"
          test -f "builds/$PROJECT_ID/app/build.gradle.kts"
          test -f "builds/$PROJECT_ID/app/src/main/AndroidManifest.xml"
      - name: Build release APK
        shell: bash
        run: |
          cd "builds/$PROJECT_ID"
          gradle :app:assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.PROJECT_ID }}
          path: builds/${{ env.PROJECT_ID }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
