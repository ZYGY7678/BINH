name: Build APK
on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - run: cd builds/${{ inputs.project_id }} && gradle :app:assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.project_id }}
          path: builds/${{ inputs.project_id }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
