name: Temporary Button E2E
on:
  push:
    branches:
      - main
    paths:
      - '.e2e-trigger'
permissions:
  contents: write
  actions: write

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Click the real site button
        env:
          SITE_URL: https://ai-app-builder-qa64.onrender.com
          TEST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/e2e.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();

          const site = process.env.SITE_URL;
          const gh = process.env.TEST_GITHUB_TOKEN;

          await page.goto(site + "/", {waitUntil:"networkidle", timeout:60000});
          await page.locator("#settingsBtn").click();
          await page.locator("#githubToken").fill(gh);
          await page.locator("#geminiKey").fill("E2E_TEST");
          await page.locator("#owner").fill("ZYGY7678");
          await page.locator("#repo").fill("BINH");

          await page.locator("#testBtn").click();
          await page.waitForFunction(
            () => document.querySelector("#testResult")?.classList.contains("ok"),
            null,
            {timeout:60000}
          );

          await page.locator("#settingsForm .primary").click();
          await page.locator("#prompt").fill("בנה אפליקציית בדיקה עם מסך אחד וכותרת E2E.");
          await page.locator("#buildBtn").click();

          const buildResponse = await page.waitForResponse(
            r => r.url().endsWith("/api/build") && r.request().method() === "POST",
            {timeout:30000}
          );
          const buildData = await buildResponse.json();
          if (!buildData.jobId) throw new Error("No jobId returned");
          fs.writeFileSync("/tmp/job-id", buildData.jobId);

          await page.waitForFunction(
            () => document.querySelector("#jobStatus")?.textContent?.trim() === "מוכן",
            null,
            {timeout:900000, polling:2000}
          );

          const runLink = await page.locator('a[href*="github.com"]').getAttribute("href");
          if (!runLink) throw new Error("No GitHub Actions link");

          const downloadPromise = page.waitForEvent("download", {timeout:60000});
          await page.locator("#download").click();
          const download = await downloadPromise;
          const tmp = await download.path();
          if (!tmp) throw new Error("Download path missing");
          const size = fs.statSync(tmp).size;
          if (size < 100000) throw new Error("Downloaded APK is suspiciously small: " + size);

          console.log("BUTTON_E2E_OK jobId=" + buildData.jobId + " apkBytes=" + size + " run=" + runLink);
          await browser.close();
          EOF
          node /tmp/e2e.mjs

      - name: Cleanup test builder branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/job-id ]; then
            JOB_ID="$(cat /tmp/job-id)"
            curl -fsS -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/ZYGY7678/BINH/git/refs/heads/builder/$JOB_ID || true
          fi
