name: Temporary Button E2E
on:
  push:
    branches:
      - main
    paths:
      - '.e2e-trigger'
permissions:
  contents: write
  actions: write

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Click real site button
        env:
          SITE_URL: https://ai-app-builder-e2e-test.onrender.com
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > click.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();

          await page.goto(process.env.SITE_URL + "/", {waitUntil:"networkidle", timeout:60000});
          await page.locator("#settingsBtn").click();
          await page.locator("#githubToken").fill(process.env.GH_TOKEN);
          await page.locator("#geminiKey").fill("E2E_TEST");
          await page.locator("#owner").fill("ZYGY7678");
          await page.locator("#repo").fill("BINH");
          await page.locator("#settingsForm .primary").click();

          await page.locator("#prompt").fill("בנה אפליקציית בדיקה עם מסך אחד וכותרת E2E.");
          const [response] = await Promise.all([
            page.waitForResponse(
              r => r.url().endsWith("/api/build") && r.request().method() === "POST",
              {timeout:30000}
            ),
            page.locator("#buildBtn").click()
          ]);

          if (!response.ok()) throw new Error("POST /api/build failed: " + response.status());
          const data = await response.json();
          if (!data.jobId) throw new Error("No jobId returned");

          fs.writeFileSync("/tmp/job-id", data.jobId);
          console.log("BUTTON_CLICK_OK jobId=" + data.jobId);
          await browser.close();
          EOF
          node click.mjs

      - name: Verify site job, Actions run, artifact, and download
        env:
          SITE_URL: https://ai-app-builder-e2e-test.onrender.com
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID="$(cat /tmp/job-id)"
          export JOB_ID
          echo "JOB_ID=$JOB_ID"

          for i in $(seq 1 180); do
            JSON="$(curl -fsS "$SITE_URL/api/build/$JOB_ID")"
            STATUS="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(x.status||"")})')"
            STAGE="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(x.stage||"")})')"
            RUN_ID="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(x.runId||"")})')"
            echo "SITE_JOB status=$STATUS stage=$STAGE runId=$RUN_ID"

            if [ "$STATUS" = "ready" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "$JSON"
              exit 1
            fi
            sleep 3
          done

          JSON="$(curl -fsS "$SITE_URL/api/build/$JOB_ID")"
          STATUS="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).status||""))')"
          test "$STATUS" = "ready" || { echo "$JSON"; exit 1; }

          RUN_ID="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runId||""))')"
          ARTIFACT_ID="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).artifactId||""))')"
          test -n "$RUN_ID"
          test -n "$ARTIFACT_ID"

          RUN_JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ZYGY7678/BINH/actions/runs/$RUN_ID")"
          NAME="$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).name||""))')"
          EVENT="$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).event||""))')"
          BRANCH="$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).head_branch||""))')"
          echo "ACTIONS run=$RUN_ID name=$NAME event=$EVENT branch=$BRANCH"
          test "$NAME" = "Build APK"
          test "$BRANCH" = "builder/$JOB_ID"

          RUN_JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ZYGY7678/BINH/actions/runs/$RUN_ID")"
          for i in $(seq 1 180); do
            STATUS_RUN="$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).status||""))')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).conclusion||""))')"
            echo "ACTIONS status=$STATUS_RUN conclusion=$CONCLUSION"
            if [ "$STATUS_RUN" = "completed" ]; then
              test "$CONCLUSION" = "success"
              break
            fi
            sleep 3
            RUN_JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ZYGY7678/BINH/actions/runs/$RUN_ID")"
          done

          ART_JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ZYGY7678/BINH/actions/runs/$RUN_ID/artifacts")"
          FOUND_ID="$(printf '%s' "$ART_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const a=(x.artifacts||[]).find(a=>a.name==="apk-"+process.env.JOB_ID && !a.expired);console.log(a?.id||"")})')"
          test "$FOUND_ID" = "$ARTIFACT_ID"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ZYGY7678/BINH/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/artifact.zip
          unzip -l /tmp/artifact.zip
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          APK="$(find /tmp/artifact -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          APK_SIZE="$(stat -c%s "$APK")"
          echo "ARTIFACT APK size=$APK_SIZE"
          test "$APK_SIZE" -gt 100000

          curl -fsSL "$SITE_URL/api/build/$JOB_ID/download" -o /tmp/downloaded.apk
          DOWNLOAD_SIZE="$(stat -c%s /tmp/downloaded.apk)"
          echo "SITE DOWNLOAD size=$DOWNLOAD_SIZE"
          test "$DOWNLOAD_SIZE" -gt 100000
          file /tmp/downloaded.apk
          unzip -t /tmp/downloaded.apk >/dev/null

          echo "BUTTON_E2E_OK jobId=$JOB_ID run=$RUN_ID artifact=$ARTIFACT_ID apkBytes=$DOWNLOAD_SIZE"

      - name: Cleanup test builder branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/job-id ]; then
            JOB_ID="$(cat /tmp/job-id)"
            curl -fsS -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/ZYGY7678/BINH/git/refs/heads/builder/$JOB_ID" || true
          fi
